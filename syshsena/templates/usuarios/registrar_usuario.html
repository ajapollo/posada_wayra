{% include 'inc/header.html' %}

<div class="page-head">
    <div class="page-head-main">
        <div class="icon-tile"><i class="bi bi-person-plus"></i></div>
        <div>
            <h1 class="page-title">Nuevo usuario</h1>
            <p class="page-subtitle">Crea la cuenta de acceso para un miembro del equipo.</p>
        </div>
    </div>
    <div class="page-actions">
        <a href="{% url 'listar_usuarios' %}" class="btn btn-light border btn-sm rounded-pill px-3 fw-semibold">
            <i class="bi bi-arrow-left me-1"></i> Volver a usuarios
        </a>
    </div>
</div>

{% if error %}
<div class="alert alert-danger d-flex align-items-center rounded-3 border-0 shadow-sm mb-4" role="alert">
    <i class="bi bi-exclamation-triangle-fill me-2"></i>
    <div class="small">{{ error }}</div>
</div>
{% endif %}

<div class="panel form-panel mb-4">
    <div class="panel-body">
        <form method="post">
            {% csrf_token %}

            <div class="form-section-title"><i class="bi bi-person-badge"></i> Datos de la cuenta</div>
            <div class="row g-3">
                <div class="col-12 col-md-6">
                    <label class="form-label" for="username">Nombre de usuario <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-at text-muted"></i></span>
                        <input type="text" id="username" name="username" class="form-control" placeholder="Ej: recepcion.wayra" required>
                    </div>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label" for="password">Contraseña <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-key text-muted"></i></span>
                        <input type="password" id="password" name="password" class="form-control" placeholder="Mínimo 6 caracteres" required>
                    </div>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label" for="first_name">Nombres</label>
                    <input type="text" id="first_name" name="first_name" class="form-control" placeholder="Ej: Laura">
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label" for="last_name">Apellidos</label>
                    <input type="text" id="last_name" name="last_name" class="form-control" placeholder="Ej: Ipuana">
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label" for="email">Correo electrónico</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-envelope text-muted"></i></span>
                        <input type="email" id="email" name="email" class="form-control" placeholder="usuario@posadawayra.com">
                    </div>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label" for="rol">Rol asignado</label>
                    <select id="rol" name="rol" class="form-select">
                        <option value="">Sin rol asignado</option>
                        {% for r in roles %}
                        <option value="{{ r.id }}">{{ r.get_nombre_display }}</option>
                        {% endfor %}
                    </select>
                    <div class="form-text extra-small">El rol define a qué módulos del sistema puede entrar.</div>
                </div>
            </div>

            <div class="form-actions">
                <a href="{% url 'listar_usuarios' %}" class="btn btn-light border rounded-pill px-4">Cancelar</a>
                <button type="submit" class="btn btn-primary rounded-pill px-4 fw-semibold">
                    <i class="bi bi-check-lg me-1"></i> Crear usuario
                </button>
            </div>
        </form>
    </div>
</div>

{% include 'inc/footer.html' %}
