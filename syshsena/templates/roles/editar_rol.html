{% include 'inc/header.html' %}

<div class="page-head">
    <div class="page-head-main">
        <div class="icon-tile"><i class="bi bi-shield-check"></i></div>
        <div>
            <h1 class="page-title">Editar rol</h1>
            <p class="page-subtitle">Actualiza el nivel de acceso de {{ rol.get_nombre_display }}.</p>
        </div>
    </div>
    <div class="page-actions">
        <a href="{% url 'listar_roles' %}" class="btn btn-light border btn-sm rounded-pill px-3 fw-semibold">
            <i class="bi bi-arrow-left me-1"></i> Volver al listado
        </a>
    </div>
</div>

{% if error %}
<div class="alert alert-danger d-flex align-items-center rounded-3 border-0 shadow-sm mb-4" role="alert">
    <i class="bi bi-exclamation-triangle-fill me-2"></i>
    <div class="small">{{ error }}</div>
</div>
{% endif %}

<div class="panel form-panel mb-4">
    <div class="panel-body">
        <form method="post">
            {% csrf_token %}
            <div class="form-section-title"><i class="bi bi-shield-check"></i> Datos del rol</div>

            <div class="row g-3">
                <div class="col-12 col-md-6">
                    <label class="form-label" for="nombreRol">Nombre del rol <span class="text-danger">*</span></label>
                    <select id="nombreRol" name="nombre" class="form-select" required>
                        {% for valor, etiqueta in opciones %}
                        <option value="{{ valor }}" {% if rol.nombre == valor %}selected{% endif %}>{{ etiqueta }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-actions">
                <a href="{% url 'listar_roles' %}" class="btn btn-light border rounded-pill px-4">Cancelar</a>
                <button type="submit" class="btn btn-primary rounded-pill px-4 fw-semibold">
                    <i class="bi bi-check-lg me-1"></i> Actualizar rol
                </button>
            </div>
        </form>
    </div>
</div>

{% include 'inc/footer.html' %}
